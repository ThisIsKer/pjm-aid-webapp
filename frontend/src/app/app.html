<div class="shell">
  <!-- Narrow rail: the logo opens the navigation menu -->
  <header class="rail">
    <button class="rail-logo" (click)="navOpen.set(!navOpen())" [attr.aria-expanded]="navOpen()" [title]="'nav.menu' | t">
      <span>PJM</span><span class="aid">aid</span>
    </button>
    @if (sync.running() && !sync.overlay()) {
      <button class="rail-btn" (click)="sync.overlay.set(true)" [title]="'nav.syncing' | t"><span class="spinner" aria-hidden="true"></span></button>
    }
    @if (secretary.running()) {
      <a class="rail-btn" routerLink="/secretary" [title]="'nav.secRunning' | t"><span class="spinner sec" aria-hidden="true"></span></a>
    }
    <a class="rail-btn gear" routerLink="/settings" routerLinkActive="active" [title]="'nav.settings' | t" [attr.aria-label]="'nav.settings' | t">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </a>
  </header>

  <!-- Navigation menu: slides in over the page -->
  <aside class="sidebar" [class.open]="navOpen()" [attr.aria-hidden]="!navOpen()">
    <div class="brand">
      <button class="brand-btn" (click)="navOpen.set(false)" [title]="'nav.close' | t">PJM <span class="aid">aid</span></button>
    </div>
    <nav>
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="navOpen.set(false)">{{ item.label | t }}</a>
      }
      <a routerLink="/settings" routerLinkActive="active" (click)="navOpen.set(false)">{{ 'nav.settings' | t }}</a>
    </nav>
    @if (sync.running() && !sync.overlay()) {
      <button class="sync-indicator" (click)="sync.overlay.set(true); navOpen.set(false)"><span class="spinner" aria-hidden="true"></span>{{ 'nav.syncing' | t }}</button>
    }
  </aside>
  @if (navOpen()) { <div class="nav-backdrop" (click)="navOpen.set(false)"></div> }

  <main class="content">
    <router-outlet />
  </main>
  <app-sync-overlay />
</div>
